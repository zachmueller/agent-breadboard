# Reference single-instance deployment ([12] §1).
#   docker compose -f deploy/compose.yaml --profile local-postgres up --build
# Profile:
#   local-postgres  — bundled Postgres 16 + pgvector (dev/quickstart). Omit to point DATABASE_URL at
#                     an external managed instance (AWS RDS is the recommended production default).
# Docker tool sandboxes: add the override file, which mounts the Docker socket and joins the server to the
# internal sandbox network (deploy/sandbox/README.md):
#   docker compose -f deploy/compose.yaml -f deploy/compose.sandbox-docker.yaml --profile local-postgres up --build
name: agent-breadboard
services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: agent-breadboard:local
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://breadboard:breadboard@postgres:5432/breadboard}
      DATABASE_SSL: ${DATABASE_SSL:-prefer}
      DATABASE_IAM_AUTH: ${DATABASE_IAM_AUTH:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SANDBOX_RUNNER: ${SANDBOX_RUNNER:-process}
      SANDBOX_DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_EGRESS_PROXY_HOST: server
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:-dev-only-change-me}
      BROKER_MASTER_KEY: ${BROKER_MASTER_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - breadboard-data:/var/breadboard
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves localhost to ::1 first and the server binds IPv4 (HOST=0.0.0.0).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["local-postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: breadboard
      POSTGRES_PASSWORD: breadboard
      POSTGRES_DB: breadboard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breadboard -d breadboard"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  breadboard-data:
  postgres-data:

networks:
  default:
    name: breadboard
