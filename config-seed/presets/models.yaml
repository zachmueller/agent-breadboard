# Model presets ([05] §4): tier name -> ordered fallback list. The gateway walks the list in order, skipping
# entries that are unavailable (deprecated, throttled, regional outage) or that fail a step's `requires`.
# v1 ships one provider adapter (AWS Bedrock), so every fallback list is Bedrock-internal. In local dev the
# gateway may map these to its mock provider; the definitions stay `provider: bedrock`.
#
# Claude and Nova 2 models are invocable on Bedrock only through an inference profile, so chat models use the
# `us.` cross-region profile ids (they work from US regions; use `eu.`/`apac.`/`global.` ids elsewhere).
schema: breadboard/presets@v1

presets:
  small:                          # classification, routing, short structured judgments
    - { provider: bedrock, model_id: "us.anthropic.claude-haiku-4-5-20251001-v1:0" }
    - { provider: bedrock, model_id: "us.amazon.nova-2-lite-v1:0" }
  medium:                         # default tier for most subagents
    - { provider: bedrock, model_id: us.anthropic.claude-sonnet-5 }
    - { provider: bedrock, model_id: "us.amazon.nova-pro-v1:0" }
    - { provider: bedrock, model_id: "us.anthropic.claude-haiku-4-5-20251001-v1:0" }
  large:                          # planning, long-form writing, config design
    - { provider: bedrock, model_id: us.anthropic.claude-opus-5, requires: [structured-output, tool-use] }
    - { provider: bedrock, model_id: us.anthropic.claude-sonnet-5 }
    - { provider: bedrock, model_id: "us.amazon.nova-pro-v1:0" }

# Embedding model for semantic knowledge search and task dedup ([07] §9).
embeddings: { provider: bedrock, model_id: "amazon.titan-embed-text-v2:0", requires: [embeddings] }
